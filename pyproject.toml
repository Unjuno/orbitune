[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitune"
version = "0.1.0"
description = "Small MIDI generation framework with LoRA adapters for local BGM creation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Orbitune contributors" }]
dependencies = []

[project.scripts]
orbitune = "orbitune.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
