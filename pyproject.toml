[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitune"
version = "0.1.0"
description = "Small MIDI generation framework with LoRA adapters for local BGM creation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Orbitune contributors" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "safetensors>=0.4"
]

[project.scripts]
orbitune = "orbitune.cli:main"
orbitune-compound = "orbitune.compound_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4"
]
export = [
  "onnx",
  "onnxscript"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orbitune*"]
exclude = ["tests*", "web*", "models*", "schemas*", "configs*", "registry*", "adapters*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
