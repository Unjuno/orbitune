name: rism-v4-census

on:
  push:
    branches:
      - audit/rism-v4-census
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest verovio==6.3.0

      - name: Focused unit tests
        run: python -m pytest -q tests/test_rism_census.py

      - name: Stream RISM export and sample exact Orbitune conversion
        env:
          PYTHONPATH: .
        run: |
          python tools/rism_census.py \
            --url https://rism.digital/exports/archive/source-2026-08-01.xml.gz \
            --sha1 69261a6a6d30fa28139147287b6fcc060fd78edc \
            --sample-size 5000 \
            --pd-death-cutoff 1955 \
            --output rism_census.json

      - name: Upload census report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rism-v4-census
          path: rism_census.json
          if-no-files-found: error
          retention-days: 14
