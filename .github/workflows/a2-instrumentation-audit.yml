name: a2-instrumentation-audit

on:
  pull_request:
    paths:
      - "scripts/audit_a2_instrumentation.py"
      - ".github/workflows/a2-instrumentation-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Orbitune
        run: python -m pip install -e .
      - name: Download exact public A2-512 checkpoint
        run: |
          mkdir -p .audit-a2
          curl --fail --location --retry 3 --output .audit-a2/model.pt \
            "https://huggingface.co/Unjuno/orbitune-a2-512/resolve/8a362fb907f96176929e6df941885bc87fbabf3d/model.pt?download=true"
          echo "25d43bd663501b5daf1b9708efe31706fd86a344f036ebe7be7a66df683eedda  .audit-a2/model.pt" | sha256sum --check --strict
      - name: Observe generated instrumentation
        run: |
          python scripts/audit_a2_instrumentation.py \
            --checkpoint .audit-a2/model.pt \
            --checkpoint-sha256 25d43bd663501b5daf1b9708efe31706fd86a344f036ebe7be7a66df683eedda \
            --events-per-seed 128 \
            --seeds 1001,1002,1003,1004,1005,1006,1007,1008 \
            --temperature 0.85 \
            --top-p 0.92 \
            --output .audit-a2/instrumentation-audit.json
      - name: Upload observation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a2-instrumentation-audit
          path: .audit-a2/instrumentation-audit.json
          if-no-files-found: error
