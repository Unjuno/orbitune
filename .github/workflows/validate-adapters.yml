name: validate-assets

on:
  pull_request:
    paths:
      - 'bases/**'
      - 'adapters/**'
      - 'orbitune/base_registry.py'
      - 'orbitune/adapter.py'
      - 'orbitune/registry.py'
      - 'orbitune/model.py'
      - 'orbitune/compat.py'
      - 'schemas/base_manifest.schema.json'
      - 'schemas/adapter_manifest.schema.json'
      - 'scripts/build_registry.py'
      - 'pyproject.toml'
      - '.github/workflows/validate-adapters.yml'
  push:
    branches: [main]
    paths:
      - 'bases/**'
      - 'adapters/**'
      - 'orbitune/base_registry.py'
      - 'orbitune/adapter.py'
      - 'orbitune/registry.py'
      - 'orbitune/model.py'
      - 'orbitune/compat.py'
      - 'schemas/base_manifest.schema.json'
      - 'schemas/adapter_manifest.schema.json'
      - 'scripts/build_registry.py'
      - 'pyproject.toml'
      - '.github/workflows/validate-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Orbitune validation dependencies
        run: python -m pip install -e .
      - name: Validate Bases, Adapters, and dependency graph
        run: |
          python scripts/build_registry.py \
            --bases bases \
            --adapters adapters \
            --base-out /tmp/orbitune-bases.json \
            --adapter-out /tmp/orbitune-adapters.json
      - name: Enforce repository artifact size policy
        run: |
          python - <<'PY'
          from pathlib import Path
          base_limit = 95 * 1024 * 1024
          adapter_limit = 5 * 1024 * 1024
          for path in Path('bases').rglob('*'):
              if path.is_file() and path.name not in {'manifest.json', 'README.md'} and path.stat().st_size > base_limit:
                  raise SystemExit(f'{path}: exceeds 95 MiB Base artifact limit')
          for manifest in Path('adapters').rglob('manifest.json'):
              directory = manifest.parent
              total = sum(path.stat().st_size for path in directory.rglob('*') if path.is_file())
              if total > adapter_limit:
                  raise SystemExit(f'{directory}: exceeds 5 MiB Adapter directory limit')
          print('repository asset size policy PASS')
          PY
