name: ml-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "orbitune/model.py"
      - "orbitune/lora.py"
      - "orbitune/training.py"
      - "orbitune/inference.py"
      - "orbitune/tokenizer/**"
      - "orbitune/release.py"
      - "scripts/smoke_train.py"
      - "scripts/continuous_train.py"
      - "pyproject.toml"
      - ".github/workflows/ml-smoke.yml"
  pull_request:
    paths:
      - "orbitune/model.py"
      - "orbitune/lora.py"
      - "orbitune/training.py"
      - "orbitune/inference.py"
      - "orbitune/tokenizer/**"
      - "orbitune/release.py"
      - "scripts/smoke_train.py"
      - "scripts/continuous_train.py"
      - "pyproject.toml"
      - ".github/workflows/ml-smoke.yml"

jobs:
  train-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install ML dependencies
        run: python -m pip install -e .[dev]
      - name: Train full 10M Base and rank-4 LoRA
        run: |
          python scripts/smoke_train.py \
            --base-steps 5 \
            --adapter-steps 5 \
            --device cpu \
            --out smoke-training-report.json
      - name: Assert measured smoke report contract
        run: |
          python - <<'PY'
          import json
          report = json.load(open('smoke-training-report.json', encoding='utf-8'))
          assert report['base']['parameters'] == 10_200_960
          assert report['adapter']['trainable_parameters'] == 28_672
          for section in ('base', 'adapter'):
              item = report[section]
              assert item['validation_loss'] > 0
              assert item['checkpoint_selection'] == 'minimum_validation_loss'
              assert item['best_validation_step'] in [point['step'] for point in item['validation_history']]
              assert item['validation_loss'] == min(point['validation_loss'] for point in item['validation_history'])
          print('ML smoke contract PASS')
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ml-smoke-report
          path: smoke-training-report.json
