name: ml-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "orbitune/model.py"
      - "orbitune/lora.py"
      - "orbitune/training.py"
      - "orbitune/tokenizer/**"
      - "scripts/smoke_train.py"
      - "pyproject.toml"
      - ".github/workflows/ml-smoke.yml"

jobs:
  train-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: python -m pip install -e .[dev]
      - name: Train full 3M-class base and rank-4 LoRA
        run: |
          python scripts/smoke_train.py \
            --base-steps 5 \
            --adapter-steps 5 \
            --device cpu \
            --out smoke-training-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ml-smoke-report
          path: smoke-training-report.json
