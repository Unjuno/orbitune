name: Publish RunPod canary image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character Orbitune commit SHA to publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runpod-canary-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.source_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA" >&2
            exit 2
          fi

      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and publish exact-commit image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: workloads/runpod-training-canary/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: |
            ghcr.io/unjuno/orbitune-runpod-canary:sha-${{ inputs.source_sha }}

      - name: Write immutable publication evidence
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$IMAGE_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "unexpected image digest: $IMAGE_DIGEST" >&2; exit 3 ;;
          esac
          mkdir -p publication-evidence
          python - <<'PY'
          import json, os
          sha = "${{ inputs.source_sha }}"
          digest = os.environ["IMAGE_DIGEST"]
          payload = {
              "schema": "orbitune-published-image-evidence-v1",
              "repository": "Unjuno/orbitune",
              "source_sha": sha,
              "dockerfile": "workloads/runpod-training-canary/Dockerfile",
              "image": f"ghcr.io/unjuno/orbitune-runpod-canary@{digest}",
              "digest": digest,
              "platform": "linux/amd64",
              "mutable_tag_for_discovery_only": f"ghcr.io/unjuno/orbitune-runpod-canary:sha-{sha}",
          }
          with open("publication-evidence/image.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          cat publication-evidence/image.json

      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runpod-canary-image-${{ inputs.source_sha }}
          path: publication-evidence/image.json
          if-no-files-found: error
          retention-days: 30
