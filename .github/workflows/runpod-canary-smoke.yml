name: runpod-canary-smoke

# Candidate freeze requires this workflow and the full pytest workflow to be green on the exact same SHA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'orbitune/model.py'
      - 'orbitune/compat.py'
      - 'orbitune/tokenizer/**'
      - 'workloads/runpod-training-canary/**'
      - '.github/workflows/runpod-canary-smoke.yml'
  pull_request:
    paths:
      - 'orbitune/model.py'
      - 'orbitune/compat.py'
      - 'orbitune/tokenizer/**'
      - 'workloads/runpod-training-canary/**'
      - '.github/workflows/runpod-canary-smoke.yml'

permissions:
  contents: read

jobs:
  cpu-contract-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run one-step canary contract through production entrypoint
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rm -rf /tmp/orbitune-runpod-canary
          python workloads/runpod-training-canary/entrypoint.py \
            --output-dir /tmp/orbitune-runpod-canary \
            --device cpu \
            --steps 1 \
            --batch-size 1 \
            --seq-len 16 \
            --validation-interval 1 | tee /tmp/orbitune-runpod-canary.log
      - name: Assert bounded success result contract and log transport
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/orbitune-runpod-canary')
          result_bytes = (root / 'result.json').read_bytes()
          result = json.loads(result_bytes)
          checkpoint = root / 'canary-base.pt'
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          assert result['schema_version'] == 1
          assert result['workload_id'] == 'orbitune-runpod-training-canary-v1'
          assert result['source_sha'] == 'unbaked-local'
          assert result['status'] == 'pass'
          assert result['device_type'] == 'cpu'
          assert result['parameters'] == 10_200_960
          assert result['tokens_processed'] == 16
          assert len(result['validation_history']) == 1
          artifact = result['artifacts'][0]
          assert artifact['name'] == 'canary-base.pt'
          assert artifact['bytes'] == checkpoint.stat().st_size
          assert artifact['bytes'] <= 64 * 1024 * 1024
          assert artifact['sha256'] == f'sha256:{digest}'
          assert artifact['disposition'] == 'collected'
          assert not (root / 'completion.json').exists()
          lines = Path('/tmp/orbitune-runpod-canary.log').read_text(encoding='utf-8').splitlines()
          markers = [line for line in lines if line.startswith('GPU_CONTROL_RESULT_JSON_V1:')]
          assert len(markers) == 1
          decoded = base64.urlsafe_b64decode(markers[0].split(':', 1)[1])
          assert decoded == result_bytes
          print('RunPod canary CPU success/log contract PASS')
          PY
      - name: Assert authenticated completion envelope contract
        env:
          PYTHONPATH: .
          ORBITUNE_SOURCE_SHA: dddddddddddddddddddddddddddddddddddddddd
          GPU_CONTROL_COMPLETION_KEY_B64: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          GPU_CONTROL_COMPLETION_KEY_ID: paid-runpod-v2
          GPU_CONTROL_COMPLETION_NONCE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GPU_CONTROL_EXECUTION_NAME: gpu-control-111111111111-aaaaaaaaaaaa
          GPU_CONTROL_PLAN_FINGERPRINT: sha256:1111111111111111111111111111111111111111111111111111111111111111
          GPU_CONTROL_IMAGE_DIGEST: sha256:2222222222222222222222222222222222222222222222222222222222222222
        run: |
          set -euo pipefail
          rm -rf /tmp/orbitune-runpod-canary-auth
          python workloads/runpod-training-canary/entrypoint.py \
            --output-dir /tmp/orbitune-runpod-canary-auth \
            --device cpu \
            --steps 1 \
            --batch-size 1 \
            --seq-len 16 \
            --validation-interval 1 | tee /tmp/orbitune-runpod-canary-auth.log
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          from pathlib import Path

          root = Path('/tmp/orbitune-runpod-canary-auth')
          result_bytes = (root / 'result.json').read_bytes()
          completion_bytes = (root / 'completion.json').read_bytes()
          evidence = json.loads(completion_bytes)
          assert evidence['schema_version'] == 2
          assert evidence['source_sha'] == 'd' * 40
          assert evidence['execution_name'] == 'gpu-control-111111111111-aaaaaaaaaaaa'
          assert 'provider_job_id' not in evidence
          assert evidence['result_sha256'] == 'sha256:' + hashlib.sha256(result_bytes).hexdigest()
          signed = {
              key: evidence[key]
              for key in (
                  'execution_name', 'image_digest', 'key_id', 'nonce',
                  'plan_fingerprint', 'result_sha256', 'source_sha'
              )
          }
          canonical = json.dumps(signed, ensure_ascii=True, sort_keys=True, separators=(',', ':')).encode()
          secret = base64.b64decode('AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=')
          expected = hmac.new(secret, canonical, hashlib.sha256).hexdigest()
          assert hmac.compare_digest(evidence['mac_sha256'], expected)

          lines = Path('/tmp/orbitune-runpod-canary-auth.log').read_text(encoding='utf-8').splitlines()
          result_markers = [line for line in lines if line.startswith('GPU_CONTROL_RESULT_JSON_V1:')]
          completion_markers = [line for line in lines if line.startswith('GPU_CONTROL_COMPLETION_JSON_V2:')]
          assert len(result_markers) == 1
          assert len(completion_markers) == 1
          assert base64.urlsafe_b64decode(result_markers[0].split(':', 1)[1]) == result_bytes
          assert base64.urlsafe_b64decode(completion_markers[0].split(':', 1)[1]) == completion_bytes
          print('RunPod authenticated completion/log envelope PASS')
          PY
      - name: Assert marker byte bound and missing-result fail closed
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import contextlib
          import importlib.util
          import io
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace

          path = Path('workloads/runpod-training-canary/entrypoint.py')
          spec = importlib.util.spec_from_file_location('orbitune_runpod_entrypoint', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as directory:
              payload = Path(directory) / 'payload.bin'
              module._MAX_MARKER_BYTES = 64
              payload.write_bytes(b'x' * 45)
              output = io.StringIO()
              with contextlib.redirect_stdout(output):
                  module._emit_file_marker('P:', payload)
              marker = output.getvalue().rstrip('\n').encode('ascii')
              assert len(marker) <= 64

              payload.write_bytes(b'x' * 46)
              try:
                  module._emit_file_marker('P:', payload)
              except ValueError as exc:
                  assert 'encoded log marker exceeds' in str(exc)
              else:
                  raise AssertionError('oversized encoded marker was accepted')

          for env_name in module._COMPLETION_ENV.values():
              os.environ.pop(env_name, None)
          module._MAX_MARKER_BYTES = 128 * 1024
          module.subprocess.run = lambda *args, **kwargs: SimpleNamespace(returncode=0)
          with tempfile.TemporaryDirectory() as directory:
              previous_argv = sys.argv
              sys.argv = ['entrypoint.py', '--output-dir', directory]
              try:
                  output = io.StringIO()
                  with contextlib.redirect_stdout(output):
                      code = module.main()
              finally:
                  sys.argv = previous_argv
              assert code == module._MISSING_RESULT_EXIT_CODE
              result = json.loads((Path(directory) / 'result.json').read_text(encoding='utf-8'))
              assert result['status'] == 'fail'
              assert result['failure_kind'] == 'runner-exited-without-result'
              assert result['runner_exit_code'] == 0
              assert output.getvalue().startswith(module.RESULT_LOG_MARKER)
          print('RunPod marker bound/missing-result fail-closed PASS')
          PY
      - name: Assert bounded failure evidence
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rm -rf /tmp/orbitune-runpod-canary-fail
          set +e
          python workloads/runpod-training-canary/entrypoint.py \
            --output-dir /tmp/orbitune-runpod-canary-fail \
            --device cpu \
            --require-cuda \
            --steps 1 \
            --batch-size 1 \
            --seq-len 16 \
            --validation-interval 1 > /tmp/orbitune-runpod-canary-fail.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          path = Path('/tmp/orbitune-runpod-canary-fail/result.json')
          result_bytes = path.read_bytes()
          result = json.loads(result_bytes)
          assert result == {
              'failure_kind': 'runner-exited-without-result',
              'runner_exit_code': result['runner_exit_code'],
              'schema_version': 1,
              'source_sha': 'unbaked-local',
              'status': 'fail',
              'workload_id': 'orbitune-runpod-training-canary-v1',
          }
          assert result['runner_exit_code'] != 0
          lines = Path('/tmp/orbitune-runpod-canary-fail.log').read_text(encoding='utf-8').splitlines()
          markers = [line for line in lines if line.startswith('GPU_CONTROL_RESULT_JSON_V1:')]
          assert len(markers) == 1
          assert base64.urlsafe_b64decode(markers[0].split(':', 1)[1]) == result_bytes
          print('RunPod canary CPU failure-evidence/log contract PASS')
          PY
