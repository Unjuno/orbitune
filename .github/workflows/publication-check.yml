name: publication-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # same pin as test.yml
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # same pin as test.yml
        with:
          python-version: '3.11'
      - name: Install lightweight check dependencies
        run: python -m pip install 'pytest>=8' 'jsonschema>=4'
      - name: Publication boundary regression tests
        run: python -m pytest -q tests/test_publication.py
      - name: Check tracked source and public documentation
        run: python scripts/check_publication.py
