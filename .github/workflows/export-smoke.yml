name: export-smoke

on:
  push:
    paths:
      - 'orbitune/model.py'
      - 'orbitune/web_model.py'
      - 'orbitune/exporting.py'
      - 'orbitune/base_registry.py'
      - 'orbitune/compat.py'
      - 'scripts/add_base.py'
      - 'scripts/build_registry.py'
      - 'pyproject.toml'
      - '.github/workflows/export-smoke.yml'
  pull_request:
    paths:
      - 'orbitune/model.py'
      - 'orbitune/web_model.py'
      - 'orbitune/exporting.py'
      - 'orbitune/base_registry.py'
      - 'orbitune/compat.py'
      - 'scripts/add_base.py'
      - 'scripts/build_registry.py'
      - 'pyproject.toml'
      - '.github/workflows/export-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install export runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[export]'
          python -m pip install onnxruntime
      - name: Create deterministic random Base checkpoint
        run: |
          python - <<'PY'
          import torch
          from orbitune.model import OrbituneConfig, OrbituneGPT
          from orbitune.tokenizer.vocab import TheoryRemiVocab
          torch.manual_seed(1234)
          model = OrbituneGPT(OrbituneConfig(vocab_size=len(TheoryRemiVocab())))
          assert model.parameter_count() == 10_200_960
          model.save_checkpoint('orbitune-base-smoke.pt')
          payload = torch.load('orbitune-base-smoke.pt', map_location='cpu', weights_only=True)
          assert payload['tokenizer'] == 'theory-remi-v0'
          PY
      - name: Export Base plus external LoRA input graph
        run: orbitune export-web-onnx --base orbitune-base-smoke.pt --out orbitune-base-web.onnx
      - name: Validate and execute dynamic ONNX graph
        run: |
          python - <<'PY'
          import numpy as np
          import onnx
          import onnxruntime as ort
          path='orbitune-base-web.onnx'
          model=onnx.load(path)
          onnx.checker.check_model(model)
          session=ort.InferenceSession(path,providers=['CPUExecutionProvider'])
          assert [item.name for item in session.get_inputs()] == ['input_ids','lora_a','lora_b','lora_scale']
          feeds={
            'input_ids':np.zeros((1,13),dtype=np.int64),
            'lora_a':np.zeros((4,2,4,448),dtype=np.float32),
            'lora_b':np.zeros((4,2,448,4),dtype=np.float32),
            'lora_scale':np.ones((1,),dtype=np.float32),
          }
          assert session.run(['logits'],feeds)[0].shape==(1,13,204)
          feeds['input_ids']=np.zeros((1,5),dtype=np.int64)
          assert session.run(['logits'],feeds)[0].shape==(1,5,204)
          print('ONNX dynamic 10M web graph PASS')
          PY
      - name: Stage and validate repository-managed Base contract
        run: |
          rm -rf /tmp/orbitune-bases /tmp/orbitune-adapters
          mkdir -p /tmp/orbitune-adapters
          python scripts/add_base.py \
            --id smoke-base \
            --display-name 'Smoke Base' \
            --checkpoint orbitune-base-smoke.pt \
            --web-onnx orbitune-base-web.onnx \
            --license Apache-2.0 \
            --training-license test-only \
            --rights-confirmed \
            --source-type synthetic_smoke \
            --commercial-eligible true \
            --distribution-scope commercial \
            --license-policy prod-only \
            --corpus-registry configs/synthetic-smoke.json \
            --corpus-manifest-sha256 2222222222222222222222222222222222222222222222222222222222222222 \
            --rights-summary 'Synthetic PROD-only smoke corpus' \
            --out-root /tmp/orbitune-bases
          python scripts/build_registry.py \
            --bases /tmp/orbitune-bases \
            --adapters /tmp/orbitune-adapters \
            --base-out /tmp/orbitune-bases.json \
            --adapter-out /tmp/orbitune-adapters.json
          python - <<'PY'
          import json
          manifest=json.load(open('/tmp/orbitune-bases/smoke-base/manifest.json',encoding='utf-8'))
          registry=json.load(open('/tmp/orbitune-bases.json',encoding='utf-8'))
          assert manifest['architecture']=='orbitune-midi-gpt-v0'
          assert manifest['tokenizer']=='theory-remi-v0'
          assert manifest['parameter_count']==10_200_960
          assert manifest['training_data']['rights_confirmed'] is True
          assert manifest['lineage']['commercial_eligible'] is True
          assert manifest['lineage']['license_policy']=='prod-only'
          assert manifest['lineage']['distribution_scope']=='commercial'
          assert registry['bases'][0]['checkpoint_sha256']==manifest['checkpoint']['sha256']
          assert registry['bases'][0]['commercial_eligible'] is True
          assert registry['bases'][0]['license_policy']=='prod-only'
          assert registry['bases'][0]['web_runtime_compatible'] is True
          print('repository Base staging contract PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbitune-web-onnx-smoke
          path: orbitune-base-web.onnx
          retention-days: 3
