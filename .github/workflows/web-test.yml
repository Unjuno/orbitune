name: web-test

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-test.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-test.yml"

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0; same pin as test.yml
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # resolved v4 pin used by the previous green run
        with:
          node-version: "22"
      - name: Run browser runtime unit tests
        run: node --test web/*.test.mjs
