name: continuous-train

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: continuous-reference-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Check whether legacy reference training is explicitly armed
        id: data
        shell: bash
        run: |
          if [[ -s data/continuous/ENABLE_LEGACY_REFERENCE_TRAINING && -s data/continuous/train.tokens && -s data/continuous/validation.tokens ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Scheduled training is idle. This workflow still trains the legacy Theory-REMI reference path. To arm it intentionally, provide reviewed train.tokens + validation.tokens and the ENABLE_LEGACY_REFERENCE_TRAINING marker. Compound production training will use a separate gate after its Base model is implemented.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.data.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Install CPU PyTorch
        if: steps.data.outputs.ready == 'true'
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install Orbitune
        if: steps.data.outputs.ready == 'true'
        run: python -m pip install -e .

      - name: Restore fast training-state cache
        if: steps.data.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .orbitune-ci-state
          key: continuous-10m-${{ github.run_id }}
          restore-keys: |
            continuous-10m-

      - name: Restore durable state from repository prerelease when cache is empty
        if: steps.data.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .orbitune-ci-state
          if [[ ! -s .orbitune-ci-state/state.pt ]] && gh release view continuous-training >/dev/null 2>&1; then
            gh release download continuous-training \
              --dir .orbitune-ci-state \
              --pattern 'state.pt' \
              --pattern 'healthy.pt' \
              --pattern 'best.pt' \
              --pattern 'report.json' || true
          fi

      - name: Continue the legacy 10M reference Base training with health monitoring
        if: steps.data.outputs.ready == 'true'
        run: |
          python scripts/continuous_train.py \
            --train data/continuous/train.tokens \
            --validation data/continuous/validation.tokens \
            --state .orbitune-ci-state/state.pt \
            --healthy-state .orbitune-ci-state/healthy.pt \
            --best .orbitune-ci-state/best.pt \
            --snapshots-dir .orbitune-ci-state/snapshots \
            --report .orbitune-ci-state/report.json \
            --max-seconds 18000 \
            --validation-interval 250 \
            --snapshot-token-interval 10000000 \
            --spike-window 100 \
            --spike-min-samples 30 \
            --spike-z-threshold 5.0 \
            --spike-consecutive-limit 3 \
            --gradient-spike-threshold 10.0 \
            --batch-size 8 \
            --seq-len 256 \
            --device cpu

      - name: Save fast training-state cache
        if: always() && steps.data.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .orbitune-ci-state
          key: continuous-10m-${{ github.run_id }}

      - name: Persist latest, healthy, best, and new immutable snapshots
        if: steps.data.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view continuous-training >/dev/null 2>&1; then
            gh release create continuous-training --prerelease --title 'Continuous training state' --notes 'Mutable legacy-reference latest/healthy state plus immutable token snapshots. Not a published Base compatibility target.'
          fi
          gh release upload continuous-training \
            .orbitune-ci-state/state.pt \
            .orbitune-ci-state/healthy.pt \
            .orbitune-ci-state/best.pt \
            .orbitune-ci-state/report.json \
            --clobber

          python - <<'PY' > /tmp/new-snapshots.txt
          import json
          report = json.load(open('.orbitune-ci-state/report.json', encoding='utf-8'))
          for path in report.get('created_snapshots', []):
              print(path)
          PY

          while IFS= read -r snapshot; do
            [[ -n "$snapshot" && -f "$snapshot" ]] || continue
            base="$(basename "$snapshot" .pt)"
            immutable=".orbitune-ci-state/${base}-step-$(python -c "import torch; p=torch.load('$snapshot', map_location='cpu', weights_only=False); print(p['global_step'])")-run-${GITHUB_RUN_ID}.pt"
            cp "$snapshot" "$immutable"
            gh release upload continuous-training "$immutable"
          done < /tmp/new-snapshots.txt

          cat .orbitune-ci-state/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Fail visibly after automatic rollback
        if: steps.data.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          report = json.load(open('.orbitune-ci-state/report.json', encoding='utf-8'))
          if report.get('status') == 'rolled_back':
              raise SystemExit(f"training rolled back automatically: {report.get('rollback_reason')}")
          print('continuous training health status: healthy')
          PY
