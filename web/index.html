<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbitune</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0 auto; padding: 1.25rem; max-width: 680px; }
      label { display: block; margin-top: 1rem; font-weight: 650; }
      input, select, button { width: 100%; box-sizing: border-box; padding: 0.8rem; margin-top: 0.35rem; font: inherit; }
      button { margin-top: 1.5rem; cursor: pointer; font-weight: 700; }
      .card { border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 16px; padding: 1.1rem; }
      .muted { opacity: 0.7; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; border-radius: 10px; background: color-mix(in srgb, currentColor 8%, transparent); }
      @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Orbitune</h1>
    <p class="muted">Small local MIDI generation with a fixed base model and community LoRA adapters.</p>

    <main class="card">
      <label for="adapter">Adapter</label>
      <select id="adapter"><option value="">Base only</option></select>
      <div id="adapter-meta" class="muted">Loading adapter registry…</div>

      <div class="row">
        <div>
          <label for="bpm">BPM</label>
          <input id="bpm" type="number" min="40" max="220" value="84" inputmode="numeric" />
        </div>
        <div>
          <label for="bars">Length</label>
          <select id="bars">
            <option value="4">4 bars</option>
            <option value="8" selected>8 bars</option>
            <option value="16">16 bars</option>
          </select>
        </div>
      </div>

      <label for="temperature">Temperature: <span id="temperature-value">0.85</span></label>
      <input id="temperature" type="range" min="0.60" max="1.20" step="0.05" value="0.85" />

      <button id="generate" type="button">Generate MIDI</button>
      <pre id="status">Loading runtime status…</pre>
    </main>

    <script>
      const adapterSelect = document.getElementById('adapter');
      const adapterMeta = document.getElementById('adapter-meta');
      const bpm = document.getElementById('bpm');
      const bars = document.getElementById('bars');
      const temperature = document.getElementById('temperature');
      const temperatureValue = document.getElementById('temperature-value');
      const status = document.getElementById('status');
      let registry = { adapters: [] };

      function updateTemperatureLabel() {
        temperatureValue.textContent = Number(temperature.value).toFixed(2);
      }

      function selectedAdapter() {
        return registry.adapters.find((item) => item.id === adapterSelect.value) || null;
      }

      function applyAdapterDefaults() {
        const adapter = selectedAdapter();
        if (!adapter) {
          adapterMeta.textContent = 'Base model only';
          return;
        }
        const defaults = adapter.generation_defaults || {};
        if (defaults.bpm) bpm.value = defaults.bpm;
        if (defaults.bars) bars.value = defaults.bars;
        if (defaults.temperature) temperature.value = defaults.temperature;
        updateTemperatureLabel();
        adapterMeta.textContent = [adapter.family || adapter.adapter_family, ...(adapter.tags || [])].filter(Boolean).join(' · ') || adapter.id;
      }

      async function loadRegistry() {
        try {
          const response = await fetch('./data/adapters.json', { cache: 'no-cache' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          registry = await response.json();
          for (const adapter of registry.adapters || []) {
            const option = document.createElement('option');
            option.value = adapter.id;
            option.textContent = adapter.display_name || adapter.id;
            adapterSelect.appendChild(option);
          }
          adapterMeta.textContent = registry.adapters?.length ? `${registry.adapters.length} adapter(s) available` : 'No bundled adapters yet — base model only';
        } catch (error) {
          adapterMeta.textContent = `Adapter registry unavailable: ${error.message}`;
        }
      }

      temperature.addEventListener('input', updateTemperatureLabel);
      adapterSelect.addEventListener('change', applyAdapterDefaults);

      document.getElementById('generate').addEventListener('click', () => {
        const adapter = selectedAdapter();
        status.textContent = [
          'Generation request prepared.',
          `adapter=${adapter?.id || 'base-only'}`,
          `bpm=${bpm.value}`,
          `bars=${bars.value}`,
          `temperature=${Number(temperature.value).toFixed(2)}`,
          '',
          'The browser runtime is the next integration step: export orbitune-tiny-v0 to ONNX/WASM, then load the selected adapter in-browser.'
        ].join('\n');
      });

      updateTemperatureLabel();
      loadRegistry().finally(() => {
        status.textContent = 'UI and adapter registry are connected. Browser model inference is not exported yet.';
      });
    </script>
  </body>
</html>
